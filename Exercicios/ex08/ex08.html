<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media-Mocanbique</title>
</head>
<body>
    <h1>Centro Multimidia</h1>

    <section>
        <h2>Video Destaque</h2>
        <iframe width="100%" height="400" src="https://www.youtube.com/embed/ptxywN-orN0?si=C902tvPfbcu-vTJk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>

    <section>
        <h2>Video Local</h2>
        <video src="video.mp4" type="video/mp4" controls width="100%" poster="poster.jpg">Video of Solo Leveling</video>
    </section>

    <section>
        <h2>Musica Ambiente</h2>
        <audio src="audio.mp3" controls></audio>
    </section>
</body>
</html>
