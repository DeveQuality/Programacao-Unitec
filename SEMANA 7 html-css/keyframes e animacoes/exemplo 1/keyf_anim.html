<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes e animacoes</title>
    <style>
        h1{
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px;
        }
        article{
            transition: 0.3s ease;
            border-radius: 100%;
            padding: 60px;
            border: 1px solid gray;
            box-shadow: 5px 2px 5px 2px gray;
            width: 250px;
            line-height: 2;
        }

        button{
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            background-color: gray;
            cursor: pointer;
        }

        span{
            color: rgb(255, 141, 2);
        }

        /* Exemplo de como usar keyframes 
            1-primeiro criamos o keyframe;
            2-Aplicamos a animacao ao elemento
        */

        @keyframes bene{
            from{
                opacity: 0;
                transform: translateY(30px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1{
            animation: bene 0.5s ease-out;
        }


        @keyframes vai-rodar{
            from{transform: rotate(0deg);}
            to{transform: rotate(360deg);}
        }
        .card{
            animation: vai-rodar 4s linear infinite;
        }


    </style>
</head>
<body>
    <h1>Aprendendo a usar <span>KEYFRAMES</span> e <span>ANIMACOES</span></h1>

    <div class="card">
        <article>
            <h2>Ola Usuario</h2>
            <p>venha aprender a programar comigo</p>
            <button>
                Aprender
            </button>
        </article>
    </div>
</body>
</html>
