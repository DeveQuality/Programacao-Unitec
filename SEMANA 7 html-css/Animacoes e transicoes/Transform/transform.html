<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        h1{
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px;
        }
        article{
            transition: 0.3s ease;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid gray;
            box-shadow: 5px 2px 5px 2px gray;
            width: 250px;
            line-height: 2;
        }

        article:hover{
            background-color:rgb(144, 144, 255);


            /* Aqui temos as transforms */

            /*
            transform: translateX(20px);    move para direita 
            transform: translateY(20px);     move para cima 
            transform: translate(20px , -10px);     move para cima e direita ao mesmo tempo


            transform: scale(1.05);     aumenta 5px
            transform: scale(0.9);      redux 10px


            transform: rotate(20deg);    rodar 45 graus sentido horario 

            transform: skew(10deg);     vai deixar obliquo 10 graus
            */
            
            transform: translateY(-4px)
                       scale(1.02)
                       rotate(2deg)
            ;

        }

        button{
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            background-color: gray;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Aprendendo a usar Transition no css</h1>

    <div class="card">
        <article>
            <h2>Ola Usuario</h2>
            <p>venha aprender a programar comigo</p>
            <button>
                Aprender
            </button>
        </article>
    </div>
</body>
</html>
