<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        h1{
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px;
        }
        article{
            
            /* aqui vamos usar as transitions */
            transition: 0.3s ease ;
            box-shadow: 0.3s ease;
            opacity: 0.2s ease;




            border-radius: 10px;
            padding: 20px;
            border: 1px solid gray;
            box-shadow: 5px 2px 5px 2px gray;
            width: 250px;
            line-height: 2;
        }

        article:hover{
            background-color:rgb(144, 144, 255);
        }

        button{
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            background-color: gray;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Aprendendo a usar Transition no css</h1>

    <div class="card">
        <article>
            <h2>Ola Usuario</h2>
            <p>venha aprender a programar comigo</p>
            <button>
                Aprender
            </button>
        </article>
    </div>
</body>
</html>
