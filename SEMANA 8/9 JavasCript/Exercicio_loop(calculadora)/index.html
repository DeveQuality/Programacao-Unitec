<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1{
            text-align: center;
        }
        div{
            margin: 20px;
            padding: 20px;
        }
        label{
            margin: 5px;
        }
        .geral{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        .container{
            border: 1px solid blue;
            border-radius: 30px;
            box-shadow: 0px 3px 4px 5px rgb(67, 67, 220);
        }
        input{
            margin: 10px;
        }
        .campos>input{
            background-color: rgba(0, 0, 255, 0.252);
            border-radius: 10px;
            border: none;
            margin: 10px;
            padding: 10px;
        }
        .operadores{
            display: flex;
            flex-flow: row wrap;
            flex-wrap: wrap;
        }
        .operadores>button{
            cursor: pointer;
            padding: 10px;
            margin: 10px;
            width: 50px;
            font-size: 1.5em;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            background-color: rgba(32, 32, 236, 0.598);
        }
        button:hover{
            background-color: rgb(19, 44, 236);
        }
        .resposta{
            background-color: rgba(216, 208, 208, 0.872);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="geral">
        <h1>Calculadora usando loops</h1>

        <div class="container">
            <div class="campos">
                <label for="number_1">Numero</label>
                <input type="number"  id="number_1" placeholder="digite o primeiro valor"> <br>
            </div>
            <hr>

            <div class="operadores">
                <button onclick="somar()">+</button>
                <button onclick="subtrair()">-</button>
                <button onclick="multiplicar()">*</button>
                <button onclick="dividir()">/</button>
            </div>


            <div id="res" class="resposta">
                Aqui vai a tabuada...
            </div>
        </div>
    </div>
    <script src="mind.js"></script>
</body>
</html>
