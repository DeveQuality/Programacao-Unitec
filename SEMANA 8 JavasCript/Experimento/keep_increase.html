<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep and encrease</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            text-align: center;
        }
        h1{
            margin-top: 200px;
        }
        .content{
            padding: 50px;
            border-radius: 20px;
            background-color: rgba(141, 186, 244, 0.437);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        button{
            padding: 15px;
            border-radius: 50%;
            font-size: 1.5em;
            margin: 20px;
            border-color: rgba(5, 187, 233, 0.894) ;
        }
        input{
            padding: 10px;
            border-radius: 10px;
            font-size: 1em;
            border-color: rgba(5, 187, 233, 0.894) ;
        }
        .Campo{
            background-color: white;
            width: 200px;
            padding: 10px;
            border-radius: 10px;
            margin-left: 10vw;
        }
    </style>
</head>
<body>
    <h1>Keep  and Encrease</h1>


    <div class="content">
        <input type="number" name="umber" id="Number" placeholder="insira um valor">
        <button onclick="acao('+')">
            +
        </button>
        <button onclick="acao('-')">
            -
        </button> 
        <div id="campo" class="Campo">
            Aqui tera o resultado
        </div>
    </div>

    <script>
        function acao(sinal){
            const numero = document.getElementById('Number').value
            const Campo = document.getElementById('campo')

            switch(sinal){

                case '+':
                    let convertido = parseInt(numero)

                    const aumentar = convertido + 10
                    Campo.innerHTML=`resultado : `+ aumentar 
                    break;

                case '-':
                    const diminuir = numero-10
                    Campo.innerHTML=`resultado : `+ diminuir 
                    break;

                default:ERRO
            }

        }

    </script>
</body>
</html>
