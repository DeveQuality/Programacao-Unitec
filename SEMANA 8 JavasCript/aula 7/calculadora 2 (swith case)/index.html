<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .titulo{
            background: linear-gradient(to right,rgba(255, 0, 0, 0.936),rgba(0, 128, 0, 0.084));
            border-radius: 10px;
        }
        section{            /* como centralizar uma div */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            
        }
        .calculadora{
            text-align: center;
            border: 2px solid rgb(255, 0, 0);
            box-shadow: 2px 5px 2px rgb(235, 23, 23);
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
            width: 300px;
        }
        .campo{
            border: 1px solid rgb(255, 0, 0);
            box-shadow: 0px 2px 2px rgb(255, 26, 14);
            height: 7vh;
            margin: 10px;
            border-radius: 10px;
        }
        button{
            margin: 10px;
            padding: 10px;
            font-weight: bold;
            font-size: 1em;
            
            cursor: pointer;
            border: none;
            border-radius: 5px;
            box-shadow:2px 2px 2px 2px rgb(250, 37, 13);
        }
        button:hover{
            background-color: rgb(255, 0, 0);
            transition: 0.5s ease;
            transform: scale(1.09) translateY(-5px);
            color: white;
            box-shadow: 0px 0px 0px 0px;
        }
        input{
            border: none;
            background-color: rgb(247, 178, 178);
            padding: 7px;
            border-radius: 7px;
        }
    </style>
</head>
<body>
    <section>

        <h1>Calculadora com Switch Case</h1>
        <div class="calculadora">
            <h1 class="titulo">calculadora</h1>
            <hr>

            <p>Num 1</p>
            <input type="number"  id="num1" placeholder="digite o primeiro valor">

            <p>Num 2</p>
            <input type="number"  id="num2" placeholder="digite o segundo valor"> <br>

            <button onclick="Calcular('+')">+</button>
            <button onclick="Calcular('-')">-</button>
            <button onclick="Calcular('/')">/</button>
            <button onclick="Calcular('*')">*</button>


            

            <div id="resultado" class="campo">
                <p>resultado</p>
            </div>
        </div>
    </section>

    <script src="javascript.js"></script>
    
</body>
</html>
