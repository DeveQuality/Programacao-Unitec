<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: bisque;
        }
    </style>
</head>
<body>
    <div class='app'> 
        <h1>Minhas Tarefas</h1>


        <div class='input-area'>

            <input type='text' id='inputTarefa'             
                placeholder='Nova tarefa...'             
                maxlength='100'
            >
                  
            <button id='btnAdicionar'>
                Adicionar
            </button>    
        </div>
 
        <div class='filtros'>      
            <button class='filtro activo' data-filtro='todas'>Todas</button>      
            <button class='filtro' data-filtro='activas'>Activas</button>      
            <button class='filtro' data-filtro='concluidas'>Concluidas</button>
        </div>

        <ul id='listaTarefas'></ul>

        <div class='rodape'>      <span id='contador'>0 tarefas restantes</span>      
            <button id='btnLimpar'>
                Limpar concluidas
            </button>    
        </div>  
    </div> 
    <script src='todo.js'></script> 
</body>
</html>
