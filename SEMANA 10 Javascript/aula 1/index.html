<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: #E8DEFF;
            color: #5B3DF5;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .content{
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }
        .app{
            border: 1px solid #5B3DF5;
            padding: 70px;
            box-shadow: 1px 1px 9px 1px;
            border-radius: 10px;
        }
        input{
            padding: 10px;
            border: none;
            background-color: #684df26a;
            border-radius: 10px;
            cursor: pointer;
        }
        .filtros{
            display: flex;
        }
        button{
            margin: 10px;
            padding: 5px;
            border-radius: 5px;
            background-color: #5B3DF5;
            color: #E8DEFF;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover{
            background-color: #bda6f7;
            color: #5B3DF5;
            border:0.5px solid #5B3DF5;
            font-weight: normal;
        }
        span{
            background-color: #5c3df53e;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class='content'> 
        <div class="app">
            <h1>Minhas Tarefas</h1>
            <div class='input-area'>
                <input type='text' id='inputTarefa'
                    placeholder='Nova tarefa...'
                    maxlength='100'
                >
            
                <button id='btnAdicionar'>
                    Adicionar
                </button>
            </div>
            <div class='filtros'>
                <button class='filtro activo' data-filtro='todas'>Todas</button>
                <button class='filtro' data-filtro='activas'>Activas</button>
                <button class='filtro' data-filtro='concluidas'>Concluidas</button>
            </div>
            <ul id='listaTarefas'></ul>
            <div class='rodape'>      <span id='contador'>0 tarefas restantes</span>
                <button id='btnLimpar'>
                    Limpar concluidas
                </button>
            </div>
        </div>
    </div> 
    <script src='todo.js'></script> 
</body>
</html>
